name: DragonEngine APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches downloaded dependencies between runs (fewer requests to Maven Central).
      - uses: gradle/actions/setup-gradle@v4

      # Works whether the project sits in the repository root or inside a sub-folder.
      - name: Locate Gradle project
        id: loc
        run: |
          G=$(find . -maxdepth 3 -name gradlew -not -path './.git/*' | head -n 1)
          if [ -z "$G" ]; then echo "gradlew not found in the repository"; exit 1; fi
          D=$(dirname "$G")
          echo "Project directory: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        working-directory: ${{ steps.loc.outputs.dir }}
        run: chmod +x gradlew

      # Maven Central sometimes answers 429 (Too Many Requests) on shared CI addresses.
      # Retry with a growing pause instead of failing the whole job.
      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Attempt $i failed, retrying in $((i*45)) seconds"
            sleep $((i*45))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: DragonEngine-APK
          path: |
            ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.loc.outputs.dir }}/app/build/intermediates/cxx/Debug/*/obj/local/arm64-v8a/libDARK_OWNER.so
          if-no-files-found: warn
          
